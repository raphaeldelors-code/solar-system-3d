<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e18" />
    <title>Orrery — offline</title>
    <style>
      :root {
        --bg: #000;
        --surface: rgba(10, 14, 24, 0.84);
        --line: rgba(120, 150, 200, 0.18);
        --line-strong: rgba(120, 150, 200, 0.35);
        --text: #cfd8e3;
        --text-bright: #eaf2ff;
        --text-dim: #8fa3bf;
        --accent: #6ea8ff;
        --accent-soft: #9cc0f0;
        --accent-glow: rgba(110, 168, 255, 0.55);
        --font-display:
          'Avenir Next', 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', system-ui,
          sans-serif;
        --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      /* A faint starfield, drawn with pure CSS (no external image). */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 20% 30%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(1px 1px at 70% 20%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1.5px 1.5px at 40% 70%, rgba(255, 255, 255, 0.45), transparent),
          radial-gradient(1px 1px at 85% 60%, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1px 1px at 10% 80%, rgba(255, 255, 255, 0.3), transparent),
          radial-gradient(1.5px 1.5px at 60% 85%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1px 1px at 90% 90%, rgba(255, 255, 255, 0.3), transparent);
        background-repeat: no-repeat;
        opacity: 0.7;
        pointer-events: none;
      }
      .wrap {
        position: relative;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 0 60px rgba(110, 168, 255, 0.08);
        backdrop-filter: blur(6px);
      }
      .glyph {
        font-size: 44px;
        line-height: 1;
        margin-bottom: 18px;
        filter: drop-shadow(0 0 18px var(--accent-glow));
      }
      h1 {
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 600;
        color: var(--text-bright);
        margin: 0 0 10px;
        letter-spacing: 0.2px;
      }
      p {
        font-size: 15px;
        line-height: 1.55;
        color: var(--text-dim);
        margin: 0 0 22px;
      }
      button {
        font-family: var(--font-body);
        font-size: 15px;
        font-weight: 600;
        color: #04101f;
        background: var(--accent);
        border: none;
        border-radius: 10px;
        padding: 12px 22px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.05s ease;
      }
      button:hover {
        background: var(--accent-soft);
      }
      button:active {
        transform: translateY(1px);
      }
      .hint {
        margin-top: 16px;
        font-size: 12.5px;
        color: var(--text-dim);
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" role="alert">
        <div class="glyph" aria-hidden="true">🪐</div>
        <h1>You're offline</h1>
        <p>
          Orrery needs a connection to load the solar system. Check your network, then try again —
          your last view is saved and will be restored.
        </p>
        <button type="button" onclick="window.location.reload()">Retry</button>
        <div class="hint">Orrery · a 3D orrery of the solar system</div>
      </div>
    </div>
  </body>
</html>
