# CI/CD: test -> build -> deploy to GitHub Pages on every push to main.
#
# Flow:
#   1. Install deps, run the test suite and the production build.
#   2. Publish the Vite `dist/` output to the `gh-pages` branch.
#   3. GitHub Pages (source: `gh-pages` branch) serves the site at
#      https://raphaeldelors-code.github.io/solar-system-3d/
#
# The build uses `base: './'` (relative asset paths) in vite.config.ts,
# so the same bundle works at the repo subpath with no changes.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Wipe stale files from the previous deploy.
          force_push: true

  # Browser E2E smoke (plan 044 D3). Runs in parallel with the deploy job:
  # it builds the production bundle, previews it, and drives headless Chromium
  # (SwiftShader software WebGL) through the five user-facing flows. A failure
  # turns the run red; it does not block the Pages deploy (the unit-test +
  # build gate above is the deploy's correctness gate).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
