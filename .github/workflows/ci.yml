# CI/CD: gate (lint/format/test/build+size-budget/E2E) on every push to main
# AND every pull request; deploy to GitHub Pages only on push to main.
#
# Flow:
#   1. Install deps, run the test suite and the production build (the build
#      includes the D5 bundle-size budget: scripts/size-budget.mjs fails the
#      build if the entry chunk exceeds the ceiling).
#   2. On push to main: publish the Vite `dist/` output to the `gh-pages`
#      branch, then smoke-check the live site (fetch / and /sw.js, assert 200).
#   3. GitHub Pages (source: `gh-pages` branch) serves the site at
#      https://raphaeldelors-code.github.io/solar-system-3d/
#
# The build uses `base: './'` (relative asset paths) in vite.config.ts,
# so the same bundle works at the repo subpath with no changes.
name: ci

on:
  push:
    branches: [main]
  # D8: run the full gate on pull requests too (not just push-to-main), so a
  # bad change is caught before merge. The deploy + smoke steps are gated on
  # `push` to main, so PRs never publish.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# D8: the deploy + post-deploy smoke only run on a push to main (never on PRs
# or manual dispatches from a branch).
env:
  IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npx vitest run

      - name: Build (includes the D5 bundle-size budget)
        run: npm run build

      - name: Deploy to GitHub Pages
        if: env.IS_MAIN_PUSH == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Wipe stale files from the previous deploy.
          force_push: true

      # D8: post-deploy smoke check. GitHub Pages can take a few seconds to a
      # minute to serve a fresh gh-pages push, so retry a handful of times
      # before failing. Asserts the shell + the service worker both load.
      - name: Post-deploy smoke check
        if: env.IS_MAIN_PUSH == 'true'
        run: |
          SITE="https://raphaeldelors-code.github.io/solar-system-3d"
          for i in 1 2 3 4 5 6; do
            code_index=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/")
            code_sw=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/sw.js")
            if [ "$code_index" = "200" ] && [ "$code_sw" = "200" ]; then
              echo "✅ Deploy smoke: / -> $code_index, /sw.js -> $code_sw"
              exit 0
            fi
            echo "attempt $i/6: / -> $code_index, /sw.js -> $code_sw (retrying in 15s)"
            sleep 15
          done
          echo "❌ Deploy smoke failed after 6 attempts"
          exit 1

  # Browser E2E smoke (plan 044 D3). Runs in parallel with the deploy job:
  # it builds the production bundle, previews it, and drives headless Chromium
  # (SwiftShader software WebGL) through the user-facing flows. A failure
  # turns the run red; it does not block the Pages deploy (the unit-test +
  # build gate above is the deploy's correctness gate).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
